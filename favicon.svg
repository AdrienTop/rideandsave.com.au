<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Green rounded background -->
  <rect width="64" height="64" rx="12" fill="#2d7a4f"/>

  <!-- Rear $ wheel (left) -->
  <text x="3" y="51" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="26" fill="white">$</text>

  <!-- Front $ wheel (right) -->
  <text x="40" y="51" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="26" fill="white">$</text>

  <!-- Saddle nestled in the S-midpoint of the rear $ (~vertical centre of the glyph) -->
  <line x1="10" y1="41" x2="25" y2="41" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Top tube: from saddle out to the handlebar area above front $ -->
  <line x1="18" y1="41" x2="47" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Handlebar stem -->
  <line x1="47" y1="23" x2="47" y2="17" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="42" y1="17" x2="53" y2="17" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
